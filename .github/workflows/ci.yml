name: data-quality-ci

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate sample data (dirty + clean)
        run: |
          python scripts/generate_sample_data.py
          python scripts/generate_sample_data.py --clean

      - name: Run pipeline on dirty data
        run: python scripts/run_pipeline.py --as-of 2026-10-31

      - name: Run pipeline on clean data
        run: python scripts/run_pipeline.py --raw-dir data/clean --out-dir reports_clean --as-of 2026-10-31

      - name: Run tests
        run: python -m pytest -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r fullstack/backend/requirements.txt

      - name: Run API tests
        working-directory: fullstack/backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fullstack/frontend/package-lock.json

      - name: Install dependencies
        working-directory: fullstack/frontend
        run: npm ci

      - name: Typecheck
        working-directory: fullstack/frontend
        run: npm run typecheck

      - name: Build
        working-directory: fullstack/frontend
        run: npm run build
